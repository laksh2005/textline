appId: com.textline.app
productName: Textline
directories:
  buildResources: build
files:
  - '!src/*'
  - '!{scripts,tests}/*'
  - '!native/uia/*.{cc,gyp}'
  - '!native/uia/build/**/*.{obj,pdb,lib,exp,iobj,ipdb,tlog,log,vcxproj*}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
  - native/uia/build/Release/*.node
win:
  executableName: Textline
  target: nsis
nsis:
  artifactName: Textline-${version}-setup.${ext}
  shortcutName: Textline
  uninstallDisplayName: Textline
  createDesktopShortcut: always
# The native addon is built by `npm run build:native`; don't rebuild during packaging.
npmRebuild: false
