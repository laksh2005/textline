<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Textline logo: a timeline (left) with a line of text at each moment. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cf08a"/>
      <stop offset="1" stop-color="#16c060"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- timeline -->
  <rect x="139" y="132" width="10" height="248" rx="5" fill="#06170c" fill-opacity="0.22"/>
  <circle cx="144" cy="164" r="22" fill="#06170c"/>
  <circle cx="144" cy="256" r="17" fill="#06170c" fill-opacity="0.55"/>
  <circle cx="144" cy="348" r="17" fill="#06170c" fill-opacity="0.3"/>

  <!-- text lines -->
  <rect x="200" y="146" width="196" height="36" rx="18" fill="#06170c"/>
  <rect x="200" y="238" width="148" height="36" rx="18" fill="#06170c" fill-opacity="0.55"/>
  <rect x="200" y="330" width="172" height="36" rx="18" fill="#06170c" fill-opacity="0.3"/>
</svg>
